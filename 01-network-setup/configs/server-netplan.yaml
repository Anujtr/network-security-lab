# Server VM - /etc/netplan/01-netcfg.yaml
# Net2 (internal server network). Default gateway is the Gateway VM's server-side interface.
network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s1:
      dhcp4: no
      addresses: [10.0.0.10/8]
      gateway4: 10.0.0.100
      nameservers:
        addresses: [8.8.8.8, 8.8.4.4]
